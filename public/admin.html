<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swati Admin</title><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><div class="brand">SWATI <span>Admin Control</span></div><nav><a href="index.html">Website</a></nav></header>
<main><section class="hero compact"><div><p class="eyebrow">ADMIN CONTROL SUITE</p><h1>Manage your portal.</h1><p>Dashboard, applications, services, roles and CMS foundation.</p></div></section>
<div class="stats"><div><b id="totalApps">0</b><span>Applications</span></div><div><b id="totalServices">0</b><span>Services</span></div><div><b>4</b><span>Roles</span></div></div>
<section class="panel"><h2>Applications</h2><div id="adminApps"></div></section>
<section class="panel"><h2>Service Manager</h2><form id="serviceForm" class="inline"><input id="newService" placeholder="New service name" required><button class="btn">Add</button></form><div id="adminServices" class="grid"></div></section>
<section class="panel"><h2>CMS Settings</h2><label>Maintenance mode <input type="checkbox" id="maintenance"></label><p class="muted">This local setting is a demo until Supabase persistence is configured.</p></section>
</main><script src="admin.js"></script></body></html>
